name: Vaasi APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaasi-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Vaasi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vaasi-apk
          path: Vaasi.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Vaasi-apk
          path: apk
      - name: Make the test PDF
        run: |
          pip install reportlab
          python3 ci/make_test_pdf.py story.pdf
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          cores: 4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: bash ci/smoke-test.sh apk/Vaasi.apk story.pdf smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vaasi-smoke-test
          path: smoke-out

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Vaasi-apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: vaasi-smoke-test
          path: out/test
      - name: Publish the APK as the "vaasi-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp out/test/sample.m4a "out/Vaasi-sample.m4a"
          gh release delete vaasi-latest --cleanup-tag --yes || true
          gh release create vaasi-latest out/Vaasi.apk out/Vaasi-sample.m4a out/test/*.png \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Vaasi for Android (build ${{ github.run_number }})" \
            --notes "Download **Vaasi.apk** on your Android phone, open it, and allow installing from your browser when asked. Each new build installs as an update over the last one. **Vaasi-sample.m4a** is a test PDF read aloud by the app on the emulator, and the PNG files are screenshots from the same automatic test."
